name: one_two_go_yeah
description: Offline cross-platform rhythm chart editor.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  otgy_native:
    path: packages/otgy_native
  path_provider: ^2.1.5
  # path_provider_android 2.3.x uses JNI and aborts in release builds before
  # the JNI environment is initialized. Stay on the last MethodChannel
  # implementation until the upstream release issue is fixed.
  path_provider_android: 2.2.23
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/guide/desktop/
    - assets/guide/mobile/
    - assets/sounds/en/
    - assets/sounds/zh/
    - assets/sounds/common/
    - assets/sounds_trimmed/zh/
