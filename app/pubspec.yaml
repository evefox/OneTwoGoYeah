name: one_two_go_yeah
description: Offline cross-platform rhythm chart editor.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  otgy_native:
    path: packages/otgy_native
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/en/
    - assets/sounds/zh/
